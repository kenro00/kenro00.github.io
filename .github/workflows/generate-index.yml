name: Generate Page Index

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Index HTML
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Index</title></head>
          <body>
            <h2>Course & Page Directory</h2>
            <ul>
          EOF

          # Find all HTML files except the index itself, sort, and format as links
          find . -type f -name "*.html" ! -name "index.html" | sort | while read -r file; do
            clean_path="${file#./}"
            echo "    <li><a href=\"$clean_path\">$clean_path</a></li>" >> index.html
          done

          cat << 'EOF' >> index.html
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
